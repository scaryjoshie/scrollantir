# scrollantir runtime — local self-hosted backend stack.
# Six services: caddy (TLS + reverse proxy), postgres (data plane),
# postgrest (REST over Postgres for ingest_api/agent_api),
# postgrest-dashboard (read-only PostgREST as user_role for the
# dashboard, behind Caddy basic_auth), api (FastAPI), agent (scheduler).
# api + agent share one Python image, two commands.
#
# Local dev:    docker compose up -d
# Hetzner deploy: see ./deploy.sh

name: scrollantir

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" (default) → HTTP-only on port 80 for local dev.
      # In production set to the public hostname so Caddy auto-ACMEs:
      # e.g. INGEST_HOSTNAME=ingest.178-104-253-30.nip.io
      INGEST_HOSTNAME: ${INGEST_HOSTNAME:-:80}
      # Optional second hostname for the dashboard (basic_auth + PostgREST
      # read-only). Default `:9999` is an unmapped container port = the
      # dashboard route is dormant locally. Set to a real hostname in
      # prod e.g. dashboard.178-104-253-30.nip.io.
      DASHBOARD_HOSTNAME: ${DASHBOARD_HOSTNAME:-:9999}
      # bcrypt hash of the dashboard password (caddy hash-password).
      # Default is a placeholder that won't match anything; gates the
      # dormant local route harmlessly.
      DASHBOARD_BCRYPT: ${DASHBOARD_BCRYPT:-$$2a$$14$$dormant.dormant.dormant.dormant.dormant.dormant.dormant.dormant.}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - postgrest
      - postgrest-dashboard
      - api

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrollantir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-scrollantir}
      # Read by db/schemas/20_roles.sh on first boot.
      AUTHENTICATOR_PW: ${AUTHENTICATOR_PW:?missing in .env}
      USER_PW: ${USER_PW:?missing in .env}
      AGENT_PW: ${AGENT_PW:?missing in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-scrollantir}" -d "${POSTGRES_DB:-scrollantir}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # PostgREST connects as `authenticator` (NOINHERIT LOGIN) and
      # SET ROLEs into `anon` for unauthenticated requests. Specific
      # ingest/agent_api EXECUTE grants on anon land in commit #3.
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PW}@postgres:5432/${POSTGRES_DB:-scrollantir}
      # `public` is intentionally NOT exposed: pgcrypto + earthdistance
      # install functions into it with default EXECUTE TO PUBLIC, which
      # PostgREST would surface as anonymous /rpc/gen_salt etc. — a
      # CPU-tunable DoS amplifier. Clients reach ingest_api via the
      # `Content-Profile: ingest_api` header (or the default since it's
      # first in the list).
      PGRST_DB_SCHEMAS: ingest_api,agent_api
      PGRST_DB_ANON_ROLE: anon
    depends_on:
      postgres:
        condition: service_healthy

  postgrest-dashboard:
    # Read-only PostgREST instance for dashboard reads. Caddy gates
    # access via basic_auth on a separate hostname. `anon` falls
    # through to `user_role`, which has SELECT on public via 90_grants.
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PW}@postgres:5432/${POSTGRES_DB:-scrollantir}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: user_role
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./app
    restart: unless-stopped
    expose:
      - "8000"
    command:
      - uvicorn
      - scrollantir.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build: ./app
    restart: unless-stopped
    environment:
      # Connects as agent_role (SELECT on public + EXECUTE on
      # agent_api.* per 90_grants.sql). AGENT_PW is the role password
      # set during postgres init from .env.
      DATABASE_URL: postgres://agent_role:${AGENT_PW}@postgres:5432/${POSTGRES_DB:-scrollantir}
      # Server-side Mapbox token for OSM Tilequery in the place_visit
      # deriver. Same `pk.*` value as the dashboard's VITE_MAPBOX_TOKEN.
      # If unset, OSM lookups silently no-op and visits emit with
      # place_id = NULL — the deriver still runs.
      MAPBOX_API_TOKEN: ${MAPBOX_API_TOKEN:-}
      # LLM classifier credentials. Cerebras primary, Groq fallback.
      # If both are unset the classifier_job logs an error per tick
      # but the agent (and deriver chain) keep running. Without these,
      # classification_queue accumulates and project_chunk rows get
      # NULL project_slug.
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-llama3.1-8b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    command:
      - python
      - -m
      - scrollantir.agent
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
