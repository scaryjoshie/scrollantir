# scrollantir runtime — local self-hosted backend stack.
# Five services: caddy (TLS + reverse proxy), postgres (data plane),
# postgrest (REST over Postgres), api (FastAPI), agent (scheduler).
# api + agent share one Python image, two commands.
#
# Local dev:    docker compose up -d
# Hetzner deploy: see ./deploy.sh

name: scrollantir

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" (default) → HTTP-only on port 80 for local dev.
      # In production set to the public hostname so Caddy auto-ACMEs:
      # e.g. INGEST_HOSTNAME=ingest.178-104-253-30.nip.io
      INGEST_HOSTNAME: ${INGEST_HOSTNAME:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - postgrest
      - api

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrollantir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-scrollantir}
      # Read by db/schemas/20_roles.sh on first boot.
      AUTHENTICATOR_PW: ${AUTHENTICATOR_PW:?missing in .env}
      USER_PW: ${USER_PW:?missing in .env}
      AGENT_PW: ${AGENT_PW:?missing in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-scrollantir}" -d "${POSTGRES_DB:-scrollantir}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # PostgREST connects as `authenticator` (NOINHERIT LOGIN) and
      # SET ROLEs into `anon` for unauthenticated requests. Specific
      # ingest/agent_api EXECUTE grants on anon land in commit #3.
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PW}@postgres:5432/${POSTGRES_DB:-scrollantir}
      # `public` is intentionally NOT exposed: pgcrypto + earthdistance
      # install functions into it with default EXECUTE TO PUBLIC, which
      # PostgREST would surface as anonymous /rpc/gen_salt etc. — a
      # CPU-tunable DoS amplifier. Clients reach ingest_api via the
      # `Content-Profile: ingest_api` header (or the default since it's
      # first in the list).
      PGRST_DB_SCHEMAS: ingest_api,agent_api
      PGRST_DB_ANON_ROLE: anon
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./app
    restart: unless-stopped
    expose:
      - "8000"
    command:
      - uvicorn
      - scrollantir.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build: ./app
    restart: unless-stopped
    command:
      - python
      - -m
      - scrollantir.agent
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
